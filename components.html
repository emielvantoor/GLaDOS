<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLaDOS Component Styles</title>
    <link rel="stylesheet" href="GLaDOSStyle/site.css">
</head>
<body>
    <div class="layout-grid">
        <nav class="sidebar">
            <h2>Components</h2>
            <ul>
                <li><a href="#button">Button</a></li>
                <li><a href="#input">Input</a></li>
                <li><a href="#card">Card</a></li>
                <li><a href="#alert">Alert</a></li>
                <li><a href="#tooltip">Tooltip</a></li>
            </ul>
        </nav>
        <main class="chat-main">
            <section id="button" class="component">
                <h3>Button</h3>
                <button class="top-tab">Primary</button>
                <button class="top-tab active">Secondary</button>
            </section>
            <section id="input" class="component">
                <h3>Input</h3>
                <input type="text" class="input-area">
            </section>
            <section id="card" class="component">
                <h3>Card</h3>
                <div class="artifact-item">
                    <div class="artifact-image"></div>
                    <div class="artifact-meta">
                        <div class="artifact-name">Example</div>
                        <div class="artifact-detail">Description</div>
                    </div>
                </div>
            </section>
            <section id="alert" class="component">
                <h3>Alert</h3>
                <div class="agent-session-status">Warning</div>
            </section>
            <section id="tooltip" class="component">
                <h3>Tooltip</h3>
                <div class="message user">
                    <div class="message-content">Hover me</div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
