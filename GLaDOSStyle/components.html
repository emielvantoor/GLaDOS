<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLaDOS Component Styles</title>
    <link rel="stylesheet" href="../GLaDOSStyle/site.css">
</head>
<body>
    <div class="layout-grid">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="panel">
                <div class="panel-title">Component Styles</div>
                <div class="chat-list">
                    <div class="chat-list-item active" data-component="header">Header</div>
                    <div class="chat-list-item" data-component="message">Message</div>
                    <div class="chat-list-item" data-component="code-block">Code Block</div>
                    <div class="chat-list-item" data-component="input-area">Input Area</div>
                </div>
            </div>
        </div>
        <!-- Main Content -->
        <div class="chat-main">
            <div class="chat-box">
                <div id="component-preview" class="message-container">
                    <!-- Header Component -->
                    <div class="header-wrapper">
                        <h1>GLaDOS Client</h1>
                    </div>
                    <!-- Message Component -->
                    <div class="message user">
                        <div class="message-content">This is a sample user message</div>
                    </div>
                    <!-- Code Block Component -->
                    <div class="code-block">
                        <div class="code-block-toolbar">
                            <div class="code-block-language">javascript</div>
                            <div class="code-block-actions">
                                <button class="code-block-button">Copy</button>
                            </div>
                        </div>
                        <pre><code>console.log("Hello, GLaDOS!");</code></pre>
                    </div>
                    <!-- Input Area Component -->
                    <div class="input-area">
                        <textarea>Enter your message...</textarea>
                        <button id="submitBtn">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.querySelectorAll('.chat-list-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.chat-list-item').forEach(el => el.classList.remove('active'));
                item.classList.add('active');
                document.getElementById('component-preview').innerHTML = '';
                
                switch(item.dataset.component) {
                    case 'header':
                        document.getElementById('component-preview').innerHTML = 
                            `<div class="header-wrapper">
                                <h1>GLaDOS Client</h1>
                            </div>`;
                        break;
                    case 'message':
                        document.getElementById('component-preview').innerHTML = 
                            `<div class="message user">
                                <div class="message-content">This is a sample user message</div>
                            </div>`;
                        break;
                    case 'code-block':
                        document.getElementById('component-preview').innerHTML = 
                            `<div class="code-block">
                                <div class="code-block-toolbar">
                                    <div class="code-block-language">javascript</div>
                                    <div class="code-block-actions">
                                        <button class="code-block-button">Copy</button>
                                    </div>
                                </div>
                                <pre><code>console.log("Hello, GLaDOS!");</code></pre>
                            </div>`;
                        break;
                    case 'input-area':
                        document.getElementById('component-preview').innerHTML = 
                            `<div class="input-area">
                                <textarea>Enter your message...</textarea>
                                <button id="submitBtn">Send</button>
                            </div>`;
                        break;
                }
            });
        });
    </script>
</body>
</html>
